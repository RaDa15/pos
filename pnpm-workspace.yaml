packages:
  - 'packages/*'
  - 'apps/*'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  core-js: true
  esbuild: true
  prisma: true

auditConfig:
  ignoreGhsas:
    - GHSA-mrhx-c7xc-m3w5

onlyBuiltDependencies:
  - esbuild
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
  - argon2
  - core-js

overrides:
  deepmerge-ts: ^8.0.0
  body-parser: ^2.4.0
